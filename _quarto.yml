project:
  type: book
  output-dir: docs
  resources:
    - data/financial-data/**
    - tools/financial-data/**
    - notebooks/bootstrap/bootstrap-demo.ipynb
    - notebooks/bootstrap/bootstrap-stata.ipynb
    - tools/bootstrap/bootstrap_core.py
    - tools/bootstrap/make_figures.py
    - tools/bootstrap/run_v10.py
    - tools/bootstrap/bootstrap.css
    - tools/bootstrap/README.md
    - tools/bootstrap/01-tiny-bootstrap.do
    - tools/bootstrap/02-group-bootstrap.do
    - tools/bootstrap/03-bdiff-interface-only.do
    - data/bootstrap/group_boot_differences.csv
    - data/bootstrap/README.md
    - data/bootstrap/tiny_exact_means.csv
    - data/bootstrap/tiny_mc_means.csv
    - data/bootstrap/tiny_sample.csv
    - data/bootstrap/two_groups_teaching.csv
    - .nojekyll
    - data/intro/*.csv
    - data/intro/source-manifest.json
    - data/intro/README.md
    - notebooks/intro/*.ipynb
    - tools/fetch_intro_prices.py
    - tools/run_notebooks.py
    - requirements.txt
    - resources/environment-agent.md
    - resources/submission-template.md
    - "!00[0-9]-*/**"
    - "!logs/**"
execute:
  enabled: false
book:
  title: "金融计量经济学"
  subtitle: "从研究问题到可复现的金融分析"
  author: "连玉君 · 中山大学岭南学院"
  date: "2026-09-09"
  date-format: iso
  site-url: https://lianxhcn.github.io/FinEco/
  repo-url: https://github.com/lianxhcn/FinEco
  repo-branch: main
  repo-actions: [edit, issue]
  reader-mode: true
  sidebar:
    logo: https://fig-lianxh.oss-cn-shenzhen.aliyuncs.com/fineco-fig02-icon-40-20260909-150949.png
    title: "金融计量经济学"
    style: docked
    search: true
  page-footer:
    left: "LN429 · 中山大学岭南学院"
    right: "[连享会](https://www.lianxh.cn) · Quarto Book"
  chapters:
    - index.qmd
    - resources.qmd
    - getting-started.qmd
    - syllabus.qmd
    - part: homework.qmd
      chapters:
        - exercises/hw-01.qmd
        - exercises/hw-02.qmd
    - part: "🛠️ 环境配置"
      chapters:
        - settings.qmd
        - publishing.qmd
    - part: "研究基础"
      chapters:
        - lectures/intro.qmd
        - notebooks/intro/portfolio-python.ipynb
        - notebooks/intro/policy-stata.ipynb
        - href: lectures/financial-data.qmd
          text: 数据流程与获取
        - href: lectures/financial-data-management.qmd
          text: 数据管理
        - href: lectures/financial-data-cleaning.qmd
          text: 数据清洗与审计
        - href: notebooks/financial-data/financial-data.ipynb
          text: CSMAR：Agent 实战
        - href: lectures/bootstrap.qmd
          text: Bootstrap
        - href: notebooks/bootstrap/bootstrap-demo.ipynb
          text: Bootstrap：Python 实验
        - href: notebooks/bootstrap/bootstrap-stata.ipynb
          text: Bootstrap：Stata 实验
    - part: "附录"
      chapters:
        - resources/references.qmd
format:
  html:
    include-in-header:
      text: |
        <link rel="icon" type="image/png" sizes="40x40" href="https://fig-lianxh.oss-cn-shenzhen.aliyuncs.com/fineco-fig02-icon-40-20260909-150949.png">
    theme: cosmo
    lang: zh
    toc: true
    toc-depth: 3
    number-sections: true
    fontsize: 17px
    linestretch: 1.7
    code-fold: false
    code-overflow: wrap
    code-line-numbers: false
    highlight-style: github
    link-external-newwindow: true
    css: styles.css
crossref:
  chapters: true
  fig-title: "图"
  tbl-title: "表"
  fig-prefix: "图"
  tbl-prefix: "表"
  eq-prefix: "式"

